# Security updates only: version-update PRs are off (open-pull-requests-limit: 0)
# and security fixes are grouped instead of one PR per package. Security PRs open
# when an advisory lands; the schedule only applies if version updates are turned on.
version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/agent-ts"
      - "/db"
      - "/frontend"
    schedule:
      interval: "quarterly"
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: "security-updates"
        patterns:
          - "*"
  - package-ecosystem: "uv"
    directory: "/agent-py"
    schedule:
      interval: "quarterly"
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: "security-updates"
        patterns:
          - "*"
